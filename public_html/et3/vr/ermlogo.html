<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
     <a-gltf-model cursor-listener id="object" src="../GLTF/Asset 2.gltf" gltf-model="../GLTF/Asset 2.gltf" position="0.00368 0.94117 -3.10748" scale="5 5 5"></a-gltf-model>
     <a-entity camera look-controls wasd-controls position="0 2 1">
  <a-entity cursor="fuse: true; fuseTimeout: 500"
            position="0 0 -1"
            geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
            material="color: black; shader: flat">
  </a-entity>
</a-entity>
</a-scene>
<script>

    let lookedAtOnce = false;
    let mySound = new Audio("../sounds/oi-oi-oe-oi-a-eye-eye.mp3")
    // Component to change to a sequential color on click.
AFRAME.registerComponent('cursor-listener', {
  init: function () {
    var lastIndex = -1;
    var COLORS = ['red', 'green', 'blue'];
    this.el.addEventListener('click', function (evt) {
      lastIndex = (lastIndex + 1) % COLORS.length;
      this.setAttribute('material', 'color', COLORS[lastIndex]);
      console.log('I was clicked at: ', evt.detail.intersection.point);

      if(this.getAttribute("id") == "object") {

        if(!lookedAtOnce) {
            alert("AHHHH OH GOD HELPPPP IT HURTS STOP CLICKING ME FUCK OFF I HATE YOU DIEEEE AHHHH IT HURTS"); lookedAtOnce = true;
            this.setAttribute("animation", "dur: 100; property: position; to: 3 0 4")
            mySound.play()
        }
        else {
            alert("STOP IT!!!! I TOLD YOU NOT TO CLICK ME!!! YOU'RE EVIL!!! AHHHH GODDD IT HURTS SO MUCHHHH")
            this.setAttribute("animation", "dur: 100; property: position; to: 0.00368 0.94117 -3.10748")
        }
      }
    });
  }
});
</script>
  </body>
</html>
